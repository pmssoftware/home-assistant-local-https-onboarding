configuration:
  auto_generate_certificates:
    name: Generate missing certificates automatically
    description: When no public root CA exists, generate a private CA and Home Assistant server certificate in /ssl without overwriting existing files.
  allow_certificate_regeneration:
    name: Allow manual server-certificate regeneration
    description: Temporarily show the protected regeneration controls on the setup page. The existing CA is kept so trusted devices remain trusted.
  ca_certificate_pem:
    name: Public CA certificate override
    description: Optional PEM text override. Normally leave empty because the app discovers the public CA automatically.
  ca_certificate_file:
    name: Public CA filename override
    description: Optional filename inside /ssl. Normally leave empty for automatic discovery.
  home_assistant_host:
    name: Home Assistant address override
    description: Optional IP address or hostname override. Normally the app detects it from the browser.
  home_assistant_https_port:
    name: Home Assistant HTTPS port
    description: HTTPS port used by Home Assistant, normally 8123.
  onboarding_http_port:
    name: Onboarding page port
    description: Host port assigned to the direct HTTP onboarding page, normally 8098. Keep this equal to the port mapping on the Network tab.
network:
  8099/tcp: Direct HTTP onboarding page
