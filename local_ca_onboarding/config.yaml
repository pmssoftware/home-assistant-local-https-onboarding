name: Local HTTPS Onboarding
version: "0.2.7"
slug: local_ca_onboarding
description: Safely guide local devices through trusting your Home Assistant CA
url: "https://github.com/pmssoftware/home-assistant-local-https-onboarding/tree/main/local_ca_onboarding"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: manual
stage: experimental
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-lock-outline
panel_title: HTTPS Setup
panel_admin: true
ports:
  8099/tcp: 8098
ports_description:
  8099/tcp: Temporary HTTP onboarding page for devices on your LAN
map:
  - type: ssl
    read_only: true
options:
  ca_certificate_pem: ""
  ca_certificate_file: ""
  home_assistant_host: ""
  home_assistant_https_port: 8123
  onboarding_http_port: 8098
schema:
  ca_certificate_pem: str
  ca_certificate_file: str
  home_assistant_host: str
  home_assistant_https_port: port
  onboarding_http_port: port
