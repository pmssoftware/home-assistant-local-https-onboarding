name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - name: Run unit and endpoint tests
        run: python -m unittest discover -s local_ca_onboarding/tests -v
      - name: Build the amd64 Home Assistant app image
        run: >-
          docker build
          --build-arg BUILD_FROM=ghcr.io/home-assistant/amd64-base:3.23
          --tag local-https-onboarding:test
          ./local_ca_onboarding
